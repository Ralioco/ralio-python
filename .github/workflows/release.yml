name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) from a manual release run.
# The workflow increments the patch version from the latest release tag by
# default, or uses the provided release tag/version for minor and major releases.
# It creates a release-only version commit when needed, tags that commit, and
# publishes the package. It never pushes directly to the protected main branch.
# No API token is stored — PyPI verifies the workflow identity directly.
# One-time setup: add this repo + workflow as a trusted publisher for the
# `ralio` project at https://pypi.org/manage/account/publishing/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag/version, e.g. v0.2.0 or 0.2.0. Leave blank to increment patch."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Require main branch
        if: github.ref_name != 'main'
        run: |
          echo "Release workflow must be run from main; selected ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve release version
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          pyproject = pathlib.Path("pyproject.toml")
          text = pyproject.read_text()
          current_match = re.search(
              r'(?m)^version = "([0-9]+)\.([0-9]+)\.([0-9]+)"$',
              text,
          )
          if not current_match:
              print("Could not find a semantic version in pyproject.toml", file=sys.stderr)
              sys.exit(1)

          subprocess.run(["git", "fetch", "--tags", "origin"], check=True)

          project_version = tuple(int(part) for part in current_match.groups())
          requested = os.environ.get("REQUESTED_TAG", "").strip()
          if requested.startswith("v"):
              requested = requested[1:]

          semver_tag = re.compile(r"^v([0-9]+)\.([0-9]+)\.([0-9]+)$")
          existing_versions = []
          for tag_name in subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True,
          ).splitlines():
              tag_match = semver_tag.fullmatch(tag_name)
              if tag_match:
                  existing_versions.append(
                      tuple(int(part) for part in tag_match.groups())
                  )

          latest_released = max(existing_versions, default=None)

          if requested:
              requested_match = re.fullmatch(r"([0-9]+)\.([0-9]+)\.([0-9]+)", requested)
              if not requested_match:
                  print("Release tag/version must look like v1.2.3 or 1.2.3", file=sys.stderr)
                  sys.exit(1)
              version_parts = tuple(int(part) for part in requested_match.groups())
          else:
              base_version = max(
                  [version for version in [project_version, latest_released] if version is not None]
              )
              major, minor, patch = base_version
              version_parts = (major, minor, patch + 1)

          if version_parts < project_version:
              current_version = ".".join(str(part) for part in project_version)
              requested_version = ".".join(str(part) for part in version_parts)
              print(
                  f"Release version {requested_version} must not be lower than {current_version}",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = ".".join(str(part) for part in version_parts)
          tag = f"v{version}"

          tag_commit = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}^{{commit}}"],
              capture_output=True,
              text=True,
          )
          tag_exists = tag_commit.returncode == 0
          if tag_commit.returncode not in {0, 1}:
              print(f"Could not check whether tag {tag} exists", file=sys.stderr)
              sys.exit(tag_commit.returncode)

          if tag_exists:
              if not requested:
                  print(f"Calculated release tag {tag} already exists", file=sys.stderr)
                  sys.exit(1)

              subprocess.run(["git", "checkout", "--detach", tag], check=True)
              tagged_text = pyproject.read_text()
              tagged_match = current_match.re.search(tagged_text)
              if not tagged_match:
                  print(f"Could not find a semantic version in {tag}", file=sys.stderr)
                  sys.exit(1)

              tagged_version = tuple(int(part) for part in tagged_match.groups())
              if tagged_version != version_parts:
                  tagged = ".".join(str(part) for part in tagged_version)
                  print(
                      f"Tag {tag} contains pyproject.toml version {tagged}, not {version}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              commit_needed = False
              tag_needed = False
          else:
              if latest_released is not None and version_parts <= latest_released:
                  latest = ".".join(str(part) for part in latest_released)
                  print(
                      f"Release version {version} must be greater than latest tag v{latest}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              commit_needed = version_parts != project_version
              updated = re.sub(
                  r'(?m)^version = "[^"]+"$',
                  f'version = "{version}"',
                  text,
                  count=1,
              )
              pyproject.write_text(updated)
              tag_needed = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"tag={tag}", file=output)
              print(f"commit_needed={str(commit_needed).lower()}", file=output)
              print(f"tag_needed={str(tag_needed).lower()}", file=output)
          PY
      - name: Commit release version
        if: steps.release.outputs.commit_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git add pyproject.toml
          git commit -m "release: ${{ steps.release.outputs.version }}"
      - run: python -m pip install --upgrade pip build twine
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - name: Create release tag
        if: steps.release.outputs.tag_needed == 'true'
        run: |
          git tag "${{ steps.release.outputs.tag }}"
      - name: Push release tag
        if: steps.release.outputs.tag_needed == 'true'
        run: |
          git push origin "refs/tags/${{ steps.release.outputs.tag }}"
      - uses: pypa/gh-action-pypi-publish@release/v1
